spring:
  application:
    name: pedidos360-payments
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pedidos360db}
    username: ${DB_USERNAME:pedidos360}
    password: ${DB_PASSWORD:change-this-password}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    # Nodos del clúster separados por coma (rabbitmq1:5672,rabbitmq2:5672); el cliente conmuta si uno cae
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:pedidos360}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: true
        initial-interval: 1s
        multiplier: 2
        max-interval: 10s
        max-attempts: 5
    listener:
      simple:
        # ACK/NACK explícito en cada consumidor (ver RabbitAckHandler)
        acknowledge-mode: manual
        prefetch: 10

app:
  rabbitmq:
    retry:
      max-attempts: ${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
      initial-interval-ms: ${RABBITMQ_RETRY_INITIAL_INTERVAL_MS:1000}
    connection-name: ${RABBITMQ_CONNECTION_NAME:ms-pagos}
