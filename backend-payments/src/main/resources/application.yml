spring:
  application:
    name: pedidos360-payments
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pedidos360db}
    username: ${DB_USERNAME:pedidos360}
    password: ${DB_PASSWORD:change-this-password}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:pedidos360}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: true
        initial-interval: 1s
        multiplier: 2
        max-interval: 10s
        max-attempts: 5
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
          max-attempts: 5

app:
  rabbitmq:
    connection-name: ${RABBITMQ_CONNECTION_NAME:ms-pagos}
