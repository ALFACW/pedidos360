name: pedidos360-frontend

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL in frontend environment file}
        VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID:?Set VITE_AZURE_CLIENT_ID in frontend environment file}
        VITE_AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID:?Set VITE_AZURE_TENANT_ID in frontend environment file}
        VITE_API_SCOPE: ${VITE_API_SCOPE:?Set VITE_API_SCOPE in frontend environment file}
    image: pedidos360/frontend:local
    restart: unless-stopped
    ports:
      - "80:80"