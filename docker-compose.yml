version: '3.8'

networks:
  pedidos360-net:
    driver: bridge

services:
  orders-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: pedidos360-orders
    restart: unless-stopped
    command: ["java", "-Xmx128m", "-jar", "/app/app.jar"]
    volumes:
      - /home/ec2-user/apps/orders.jar:/app/app.jar:ro
    ports:
      - "8080:8080"
    networks:
      - pedidos360-net

  products-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: pedidos360-products
    restart: unless-stopped
    command: ["java", "-Xmx128m", "-jar", "/app/app.jar"]
    volumes:
      - /home/ec2-user/apps/products.jar:/app/app.jar:ro
    ports:
      - "8081:8081"
    networks:
      - pedidos360-net

  users-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: pedidos360-users
    restart: unless-stopped
    command: ["java", "-Xmx128m", "-jar", "/app/app.jar"]
    volumes:
      - /home/ec2-user/apps/users.jar:/app/app.jar:ro
    ports:
      - "8082:8082"
    networks:
      - pedidos360-net

  frontend:
    image: nginx:alpine
    container_name: pedidos360-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /var/www/pedidos360:/var/www/pedidos360:ro
      - /home/ec2-user/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - orders-service
      - products-service
      - users-service
    networks:
      - pedidos360-net
