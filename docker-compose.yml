version: '3.8'

services:
  orders-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pedidos360-orders
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_TENANT_ID=e5372bf0-c5e3-4286-887c-79069f209c1f
    restart: unless-stopped

  products-service:
    build:
      context: ./backend-products
      dockerfile: Dockerfile
    container_name: pedidos360-products
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_TENANT_ID=e5372bf0-c5e3-4286-887c-79069f209c1f
    restart: unless-stopped

  users-service:
    build:
      context: ./backend-users
      dockerfile: Dockerfile
    container_name: pedidos360-users
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_TENANT_ID=e5372bf0-c5e3-4286-887c-79069f209c1f
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pedidos360-frontend
    ports:
      - "5173:80"
    depends_on:
      - orders-service
      - products-service
      - users-service
    restart: unless-stopped
