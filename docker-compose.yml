name: pedidos360-backend

networks:
  pedidos360-net:
    driver: bridge

volumes:
  rabbitmq1_data:
  rabbitmq2_data:

services:
  rabbitmq1:
    image: rabbitmq:3-management
    hostname: rabbitmq1
    # Los 2 nodos arrancan a la vez: el peer discovery elige uno como semilla y el otro se une
    restart: unless-stopped
    # Ambos nodos comparten la misma Erlang cookie: es la credencial que los une en un clúster
    entrypoint: ["/bin/sh", "-c", "echo \"$$RABBITMQ_ERLANG_COOKIE\" > /var/lib/rabbitmq/.erlang.cookie && chown rabbitmq:rabbitmq /var/lib/rabbitmq/.erlang.cookie && chmod 400 /var/lib/rabbitmq/.erlang.cookie && exec docker-entrypoint.sh rabbitmq-server"]
    ports:
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Set RABBITMQ_ERLANG_COOKIE in .env}
    volumes:
      - rabbitmq1_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - pedidos360-net

  rabbitmq2:
    image: rabbitmq:3-management
    hostname: rabbitmq2
    restart: unless-stopped
    # Ambos nodos comparten la misma Erlang cookie: es la credencial que los une en un clúster
    entrypoint: ["/bin/sh", "-c", "echo \"$$RABBITMQ_ERLANG_COOKIE\" > /var/lib/rabbitmq/.erlang.cookie && chown rabbitmq:rabbitmq /var/lib/rabbitmq/.erlang.cookie && chmod 400 /var/lib/rabbitmq/.erlang.cookie && exec docker-entrypoint.sh rabbitmq-server"]
    ports:
      - "127.0.0.1:15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Set RABBITMQ_ERLANG_COOKIE in .env}
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - pedidos360-net

  ms-pedidos:
    build:
      context: ./backend-orders
    image: pedidos360/ms-pedidos:local
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      RABBITMQ_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DB_URL: ${DB_URL:?Set DB_URL in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Set KAFKA_BOOTSTRAP_SERVERS in .env}
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq1:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
    networks:
      - pedidos360-net

  ms-productos:
    build:
      context: ./backend-products
    image: pedidos360/ms-productos:local
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      DB_URL: ${DB_URL:?Set DB_URL in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Set KAFKA_BOOTSTRAP_SERVERS in .env}
    ports:
      - "8081:8081"
    networks:
      - pedidos360-net

  ms-usuarios:
    build:
      context: ./backend-users
    image: pedidos360/ms-usuarios:local
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      DB_URL: ${DB_URL:?Set DB_URL in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    ports:
      - "8082:8082"
    networks:
      - pedidos360-net

  ms-carrito:
    build:
      context: ./backend-cart
    image: pedidos360/ms-carrito:local
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      APP_CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Set KAFKA_BOOTSTRAP_SERVERS in .env}
    ports:
      - "8083:8083"
    networks:
      - pedidos360-net

  ms-rabbit-admin:
    build:
      context: ./backend-rabbit-admin
    image: pedidos360/ms-rabbit-admin:local
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      RABBITMQ_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      APP_CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env}
    ports:
      - "8084:8084"
    depends_on:
      rabbitmq1:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
    networks:
      - pedidos360-net

  ms-pagos:
    build:
      context: ./backend-payments
    image: pedidos360/ms-pagos:local
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      RABBITMQ_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      DB_URL: ${DB_URL:?Set DB_URL in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Set KAFKA_BOOTSTRAP_SERVERS in .env}
      WEBPAY_URL_RETORNO: ${FRONTEND_URL:?Set FRONTEND_URL in .env}
    ports:
      - "8085:8085"
    depends_on:
      rabbitmq1:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
    networks:
      - pedidos360-net

  ms-recomendaciones:
    build:
      context: ./backend-recomendaciones
    image: pedidos360/ms-recomendaciones:local
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Set KAFKA_BOOTSTRAP_SERVERS in .env}
    ports:
      - "8086:8086"
    networks:
      - pedidos360-net

  ms-administrador-kafka:
    build:
      context: ./backend-administrador-kafka
    image: pedidos360/ms-administrador-kafka:local
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Set KAFKA_BOOTSTRAP_SERVERS in .env}
