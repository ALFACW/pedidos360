server:
  port: 8080

spring:
  application:
    name: pedidos360-orders
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pedidos360db}
    username: ${DB_USERNAME:pedidos360}
    password: ${DB_PASSWORD:change-this-password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
        max.block.ms: 3000
  rabbitmq:
    # Nodos del clúster separados por coma (rabbitmq1:5672,rabbitmq2:5672); el cliente conmuta si uno cae
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:pedidos360}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: true
        initial-interval: 1s
        multiplier: 2
        max-interval: 10s
        max-attempts: 5
    listener:
      simple:
        # ACK/NACK explícito en cada consumidor (ver RabbitAckHandler)
        acknowledge-mode: manual
        prefetch: 10
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/
          tenant-id: e5372bf0-c5e3-4286-887c-79069f209c1f

app:
  rabbitmq:
    retry:
      max-attempts: ${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
      initial-interval-ms: ${RABBITMQ_RETRY_INITIAL_INTERVAL_MS:1000}
    connection-name: ${RABBITMQ_CONNECTION_NAME:ms-pedidos}
  security:
    jwt:
      audience: ${JWT_AUDIENCE:96aa35e3-1c70-4e36-8a41-0e1089f78df1}
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,https://pedidos360-frontend.example.com

logging:
  level:
    org.springframework.security: INFO
