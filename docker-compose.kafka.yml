# Kafka: 3 Zookeeper + 3 brokers + Kafka UI. Uso: KAFKA_HOST_IP=<ip privada> docker compose -f docker-compose.kafka.yml up -d
name: pedidos360-kafka

x-zookeeper: &zookeeper
  image: confluentinc/cp-zookeeper:7.5.0
  restart: unless-stopped

x-zookeeper-env: &zookeeper-env
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
  KAFKA_HEAP_OPTS: "-Xms128m -Xmx128m"

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.5.0
  restart: unless-stopped
  depends_on: [zookeeper1, zookeeper2, zookeeper3]

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"

services:
  zookeeper1:
    <<: *zookeeper
    environment: { <<: *zookeeper-env, ZOOKEEPER_SERVER_ID: 1 }
  zookeeper2:
    <<: *zookeeper
    environment: { <<: *zookeeper-env, ZOOKEEPER_SERVER_ID: 2 }
  zookeeper3:
    <<: *zookeeper
    environment: { <<: *zookeeper-env, ZOOKEEPER_SERVER_ID: 3 }

  kafka1:
    <<: *kafka
    ports: ["9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:29092,PLAINTEXT_HOST://${KAFKA_HOST_IP:?}:9092
    volumes: [kafka1_data:/var/lib/kafka/data]
  kafka2:
    <<: *kafka
    ports: ["9093:9093"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:29092,PLAINTEXT_HOST://${KAFKA_HOST_IP:?}:9093
    volumes: [kafka2_data:/var/lib/kafka/data]
  kafka3:
    <<: *kafka
    ports: ["9094:9094"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:29092,PLAINTEXT_HOST://${KAFKA_HOST_IP:?}:9094
    volumes: [kafka3_data:/var/lib/kafka/data]

  # Crea los tópicos: 3 particiones, 3 réplicas; retención según el uso de cada flujo
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [kafka1, kafka2, kafka3]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        BS=kafka1:29092,kafka2:29092,kafka3:29092
        until [ "$$(kafka-broker-api-versions --bootstrap-server $$BS 2>/dev/null | grep -c 'id:')" -ge 3 ]; do sleep 3; done
        crear() { kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic $$1 --partitions 3 --replication-factor 3 --config retention.ms=$$2; }
        crear pedidos360.intentos-pago 86400000
        crear pedidos360.interacciones-usuario 604800000
        crear pedidos360.intentos-pago.DLT 1209600000
        crear pedidos360.interacciones-usuario.DLT 1209600000

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on: [kafka1, kafka2, kafka3]
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper1:2181
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  kafka1_data:
  kafka2_data:
  kafka3_data:
